name: Core smoke

on:
  push:
  pull_request:

jobs:
  core-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile core modules
        run: python -m py_compile model.py presets.py
      - name: Run core smoke test
        run: python test_core.py
